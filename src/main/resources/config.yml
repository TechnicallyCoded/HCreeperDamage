# List of worlds where explosion damage filtering should apply
worlds:
  - survival

# Entities that cannot damage blocks with explosions in the configured worlds
# Valid values: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/EntityType.html
no-block-damage:
  - CREEPER

# Entities that cannot damage player/entity health with explosions in the configured worlds
no-health-damage: []

# When true, creeper explosions drop every block they destroy (even ones normally lost)
creeper-drop-all-blocks: false